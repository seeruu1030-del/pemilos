<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="w-full h-full">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="hdr1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect y="400" width="800" height="100" fill="#CBD5E1"/>

  <!-- Top School Header Banner -->
  <rect x="150" y="20" width="500" height="50" rx="12" fill="url(#hdr1)" filter="url(#dropShadow)"/>
  <text x="400" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    E-VOTING PEMILOS SMKS NURUL ISLAM
  </text>

  <!-- Merah Putih Flag -->
  <rect x="40" y="20" width="70" height="22" fill="#DC2626" rx="2"/>
  <rect x="40" y="42" width="70" height="22" fill="#FFFFFF" rx="2"/>
  <rect x="38" y="18" width="4" height="90" fill="#64748B"/>

  <!-- Computer Desk 1 -->
  <rect x="60" y="240" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" filter="url(#dropShadow)"/>
  <!-- Monitor 1 -->
  <rect x="100" y="140" width="200" height="130" rx="8" fill="#1E293B"/>
  <rect x="108" y="148" width="184" height="114" rx="4" fill="#38BDF8"/>
  <rect x="175" y="270" width="50" height="25" fill="#64748B"/>
  <rect x="150" y="295" width="100" height="10" fill="#475569"/>
  <!-- Monitor UI -->
  <rect x="120" y="160" width="160" height="25" rx="4" fill="#1E3A8A"/>
  <text x="200" y="177" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BILIK E-VOTING 01</text>
  <rect x="130" y="195" width="60" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="210" y="195" width="60" height="50" rx="4" fill="#FFFFFF"/>

  <!-- Computer Desk 2 -->
  <rect x="460" y="240" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" filter="url(#dropShadow)"/>
  <!-- Monitor 2 -->
  <rect x="500" y="140" width="200" height="130" rx="8" fill="#1E293B"/>
  <rect x="508" y="148" width="184" height="114" rx="4" fill="#38BDF8"/>
  <rect x="575" y="270" width="50" height="25" fill="#64748B"/>
  <rect x="550" y="295" width="100" height="10" fill="#475569"/>
  <!-- Monitor UI -->
  <rect x="520" y="160" width="160" height="25" rx="4" fill="#1E3A8A"/>
  <text x="600" y="177" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BILIK E-VOTING 02</text>
  <rect x="530" y="195" width="60" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="610" y="195" width="60" height="50" rx="4" fill="#FFFFFF"/>

  <!-- Indonesian SMK Student Vector (Seragam Putih Abu-Abu) -->
  <g transform="translate(350, 180)">
    <!-- Body / Shirt -->
    <path d="M 30 110 Q 50 80 70 110 L 85 220 L 15 220 Z" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
    <!-- Tie -->
    <polygon points="50,110 44,170 50,185 56,170" fill="#475569"/>
    <!-- OSIS Badge -->
    <rect x="60" y="130" width="12" height="16" fill="#1E3A8A" rx="2"/>
    <!-- Trousers (Abu-Abu) -->
    <rect x="25" y="220" width="22" height="100" fill="#64748B"/>
    <rect x="53" y="220" width="22" height="100" fill="#64748B"/>
    <!-- Head -->
    <circle cx="50" cy="55" r="30" fill="#FED7AA"/>
    <!-- Hair -->
    <path d="M 20 50 Q 50 10 80 50 Q 75 25 50 25 Q 25 25 20 50 Z" fill="#1E293B"/>
    <!-- Face details -->
    <circle cx="42" cy="55" r="3" fill="#1E293B"/>
    <circle cx="58" cy="55" r="3" fill="#1E293B"/>
    <path d="M 45 70 Q 50 76 55 70" stroke="#1E293B" stroke-width="2" fill="none"/>
  </g>

  <!-- Step Label Card -->
  <rect x="250" y="420" width="300" height="55" rx="10" fill="#1E3A8A" filter="url(#dropShadow)"/>
  <text x="400" y="453" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    1. MENUGU BILIK SUARA DIGITAL
  </text>
</svg>