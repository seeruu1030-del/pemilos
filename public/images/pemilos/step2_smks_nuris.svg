<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="w-full h-full">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="hdr2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Computer Screen Container -->
  <rect x="50" y="30" width="700" height="380" rx="16" fill="#FFFFFF" stroke="#0284C7" stroke-width="4" filter="url(#shadow2)"/>
  
  <!-- Header Bar -->
  <rect x="50" y="30" width="700" height="55" rx="14" fill="url(#hdr2)"/>
  <text x="400" y="65" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    KANDIDAT KETUA &amp; WAKIL OSIS SMKS NURUL ISLAM
  </text>

  <!-- Paslon 01 Card -->
  <rect x="80" y="110" width="300" height="270" rx="12" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
  <rect x="80" y="110" width="300" height="40" rx="10" fill="#0284C7"/>
  <text x="230" y="136" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">PASLON NO. 01</text>
  
  <!-- Paslon 01 Photo Avatar -->
  <circle cx="150" cy="200" r="35" fill="#BAE6FD"/>
  <circle cx="150" cy="190" r="15" fill="#0284C7"/>
  <path d="M 130 225 Q 150 205 170 225 Z" fill="#0284C7"/>

  <!-- Paslon 01 Names & Visi -->
  <text x="200" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A">MUHAMMAD RIZKY</text>
  <text x="200" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748B">&amp; SITI NURHALIZA</text>
  <rect x="100" y="250" width="260" height="110" rx="8" fill="#EFF6FF"/>
  <text x="110" y="272" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0284C7">VISI &amp; MISI UNGGULAN:</text>
  <text x="110" y="295" font-family="sans-serif" font-size="11" fill="#334155">• Memajukan Kedisiplinan &amp; Keahlian SMK</text>
  <text x="110" y="315" font-family="sans-serif" font-size="11" fill="#334155">• Program Ekstrakurikuler Berbasis Teknologi</text>
  <text x="110" y="335" font-family="sans-serif" font-size="11" fill="#334155">• Kolaborasi Industri &amp; Kewirausahaan Siswa</text>

  <!-- Paslon 02 Card -->
  <rect x="420" y="110" width="300" height="270" rx="12" fill="#F8FAFC" stroke="#F59E0B" stroke-width="2"/>
  <rect x="420" y="110" width="300" height="40" rx="10" fill="#F59E0B"/>
  <text x="570" y="136" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">PASLON NO. 02</text>
  
  <!-- Paslon 02 Photo Avatar -->
  <circle cx="490" cy="200" r="35" fill="#FEF3C7"/>
  <circle cx="490" cy="190" r="15" fill="#D97706"/>
  <path d="M 470 225 Q 490 205 510 225 Z" fill="#D97706"/>

  <!-- Paslon 02 Names & Visi -->
  <text x="540" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A">AHMAD FADILLAH</text>
  <text x="540" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748B">&amp; DEWI ANGGRAENI</text>
  <rect x="440" y="250" width="260" height="110" rx="8" fill="#FFFBEB"/>
  <text x="450" y="272" font-family="sans-serif" font-size="11" font-weight="bold" fill="#D97706">VISI &amp; MISI UNGGULAN:</text>
  <text x="450" y="295" font-family="sans-serif" font-size="11" fill="#334155">• Meningkatkan Prestasi Prestisius SMKS Nurul Islam</text>
  <text x="450" y="315" font-family="sans-serif" font-size="11" fill="#334155">• Mewujudkan Lingkungan Sekolah Religius &amp; Kreatif</text>
  <text x="450" y="335" font-family="sans-serif" font-size="11" fill="#334155">• Optimalisasi Sarana Digital Sekolah</text>

  <!-- Step Label Card -->
  <rect x="250" y="430" width="300" height="55" rx="10" fill="#0284C7" filter="url(#shadow2)"/>
  <text x="400" y="463" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    2. CERMATI PASANGAN CALON
  </text>
</svg>