<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="w-full h-full">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="hdr4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)"/>

  <!-- Computer Monitor Frame -->
  <rect x="100" y="20" width="600" height="390" rx="18" fill="#1E293B" filter="url(#shadow4)"/>
  <rect x="115" y="35" width="570" height="360" rx="10" fill="#FFFFFF"/>

  <!-- Header Banner -->
  <rect x="115" y="35" width="570" height="55" rx="8" fill="url(#hdr4)"/>
  <text x="400" y="68" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    E-VOTING SMKS NURUL ISLAM • SUARA TERVERIFIKASI
  </text>

  <!-- Large Glowing Checkmark Badge -->
  <circle cx="400" cy="180" r="55" fill="#10B981" filter="url(#shadow4)"/>
  <circle cx="400" cy="180" r="45" fill="#FFFFFF"/>
  <path d="M 380 180 L 393 195 L 422 165" stroke="#10B981" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Success Message Text -->
  <text x="400" y="270" font-family="sans-serif" font-size="22" font-weight="900" fill="#065F46" text-anchor="middle">
    HAK PILIH ANDA BERHASIL DICATAT!
  </text>
  <text x="400" y="295" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">
    Suara Anda disimpan secara rahasia, atomik &amp; memperbarui Real Count secara realtime.
  </text>

  <!-- Realtime Update Stats Box -->
  <rect x="180" y="320" width="440" height="60" rx="10" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="2"/>
  <circle cx="210" cy="350" r="8" fill="#10B981"/>
  <text x="230" y="354" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065F46">
    Status: Terverifikasi Sistem E-Voting SMKS Nurul Islam
  </text>

  <!-- Step Label Card -->
  <rect x="250" y="430" width="300" height="55" rx="10" fill="#059669" filter="url(#shadow4)"/>
  <text x="400" y="463" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    4. SUARA TERVERIFIKASI DIGITAL
  </text>
</svg>