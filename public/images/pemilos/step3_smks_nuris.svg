<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="w-full h-full">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Tablet Frame -->
  <rect x="150" y="20" width="500" height="390" rx="20" fill="#1E293B" filter="url(#shadow3)"/>
  <rect x="165" y="35" width="470" height="360" rx="12" fill="#FFFFFF"/>

  <!-- Banner Tablet Screen -->
  <rect x="165" y="35" width="470" height="60" rx="10" fill="#DC2626"/>
  <text x="400" y="60" font-family="sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    PEMILOS SMKS NURUL ISLAM
  </text>
  <text x="400" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FEF2F2" text-anchor="middle">
    KONFIRMASI PILIHAN KANDIDAT KETUA &amp; WAKIL OSIS
  </text>

  <!-- Candidate Selection Box -->
  <rect x="200" y="115" width="400" height="150" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="250" cy="180" r="30" fill="#93C5FD"/>
  <text x="250" y="186" font-family="sans-serif" font-size="16" font-weight="900" fill="#1E3A8A" text-anchor="middle">01</text>
  <text x="300" y="165" font-family="sans-serif" font-size="16" font-weight="900" fill="#1E293B">MUHAMMAD RIZKY</text>
  <text x="300" y="185" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569">&amp; SITI NURHALIZA</text>
  <text x="300" y="205" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563EB">Calon Ketua &amp; Wakil OSIS No. Urut 01</text>

  <!-- Big Interactive VOTE BUTTON -->
  <rect x="230" y="285" width="340" height="65" rx="16" fill="url(#btnGrad)" filter="url(#shadow3)"/>
  <!-- Checkmark Icon -->
  <circle cx="280" cy="317" r="18" fill="#FFFFFF"/>
  <path d="M 272 317 L 278 324 L 290 310" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="430" y="324" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    PILIH PASLON INI
  </text>

  <!-- Hand Vector Clicking the Button -->
  <g transform="translate(520, 310)">
    <path d="M 0 30 Q -10 10 10 -10 Q 25 -20 35 0 L 50 20 L 70 80 L 10 80 Z" fill="#FED7AA" stroke="#D97706" stroke-width="2"/>
  </g>

  <!-- Step Label Card -->
  <rect x="250" y="430" width="300" height="55" rx="10" fill="#D97706" filter="url(#shadow3)"/>
  <text x="400" y="463" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    3. GUNAKAN HAK PILIH
  </text>
</svg>